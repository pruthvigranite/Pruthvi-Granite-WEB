<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Stonova</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/images/logo/logo.svg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rufina:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- AOS (Animate On Scroll) Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: "#C5A059",
                dark: "#111111",
                gray: "#2A2A2A",
                light: "#F5F5F5",
                brown: "#987C38",
              },
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
              serif: ["Rufina", "serif"],
            },
            backgroundImage: {
              "gallery-hero":
                "url('../assets/images/gallery/gallery_header.webp')",
            },
          },
        },
      };
    </script>

    <style>
      /* Custom Utilities */
      .glass-nav {
        background: rgba(17, 17, 17, 0.95);
        backdrop-filter: blur(5px);
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #c5a059;
        border-radius: 4px;
      }

      /* Gold Vertical Divider */
      .gold-divider {
        width: 2px;
        background-color: #c5a059;
        height: 100%;
        display: none; /* Hidden on mobile */
      }
      @media (min-width: 768px) {
        .gold-divider {
          display: block;
        }
      }
    </style>
  </head>
  <body
    class="bg-white text-gray-800 font-sans antialiased overflow-x-hidden flex flex-col min-h-screen"
  >
    <div id="nav-placeholder"></div>

    <header class="relative h-[45vh] w-full bg-gallery-hero bg-cover bg-center">
      <div class="absolute inset-0 bg-black/40"></div>

      <div
        class="relative z-10 h-full container mx-auto px-6 flex flex-col justify-end pb-16 items-center text-center text-white"
      >
        <h1 class="font-serif text-5xl md:text-7xl mb-4 drop-shadow-lg">
          Gallery
        </h1>
        <p
          class="text-lg md:text-xl font-light tracking-wide max-w-2xl text-gray-100 drop-shadow-md"
        >
          Explore our diverse stone collection crafted to elevate every space
        </p>
      </div>
    </header>

    <section class="py-20 md:pb-32 bg-white">
      <div class="container mx-auto px-6">
        <div
          class="flex flex-col md:flex-row justify-between relative min-h-[600px]"
        >
          <a
            href="../gallery/Kitchen_gallery.html"
            class="w-full md:w-[30%] flex flex-col items-center group cursor-pointer mb-12 md:mb-0"
          >
            <div class="w-full flex flex-col items-center">
              <h2
                class="text-2xl text-gray-700 font-sans tracking-[0.2em] uppercase mb-8 group-hover:text-brand-gold transition-colors"
              >
                KITCHEN
              </h2>
              <div
                class="w-full h-[450px] overflow-hidden rounded-[40px] shadow-xl relative"
              >
                <img
                  src="./assets/images/gallery/kitchen.webp"
                  alt="Modern Kitchen"
                  class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                />
              </div>
            </div>
          </a>

          <div class="gold-divider"></div>

          <a
            href="../gallery/Bathroom_gallery.html"
            class="w-full md:w-[30%] flex flex-col items-center group cursor-pointer mt-0 md:mt-32 mb-12 md:mb-0"
          >
            <div class="w-full flex flex-col items-center">
              <h2
                class="text-2xl text-gray-700 font-sans tracking-[0.2em] uppercase mb-8 group-hover:text-brand-gold transition-colors"
              >
                BATHROOM
              </h2>
              <div
                class="w-full h-[450px] overflow-hidden rounded-[40px] shadow-xl relative"
              >
                <img
                  src="./assets/images/gallery/bathroom.webp"
                  alt="Green Vanity Bathroom"
                  class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                />
              </div>
            </div>
          </a>

          <div class="gold-divider"></div>

          <a
            href="../gallery/other_gallery.html"
            class="w-full md:w-[30%] flex flex-col items-center group cursor-pointer"
          >
            <div class="w-full flex flex-col items-center">
              <h2
                class="text-2xl text-gray-700 font-sans tracking-[0.2em] uppercase mb-8 group-hover:text-brand-gold transition-colors"
              >
                OTHER
              </h2>
              <div
                class="w-full h-[450px] overflow-hidden rounded-[40px] shadow-xl relative"
              >
                <img
                  src="./assets/images/gallery/other.webp"
                  alt="Stone Table Detail"
                  class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                />
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script>
      // --- Component Loading Logic ---

      function fetchComponent(elementId, filePath) {
        return fetch(filePath)
          .then((response) => {
            if (!response.ok) throw new Error("Load failed");
            return response.text();
          })
          .then((html) => {
            const container = document.getElementById(elementId);
            container.innerHTML = html;
            // Execute internal scripts (like mobile menu)
            container.querySelectorAll("script").forEach((old) => {
              const script = document.createElement("script");
              script.textContent = old.textContent;
              document.body.appendChild(script);
            });
          })
          .catch((e) => console.error("Error loading component:", e));
      }

      document.addEventListener("DOMContentLoaded", () => {
        // 1. Load Navbar and Footer
        Promise.all([
          fetchComponent("nav-placeholder", "./components/navbar.html"),
          fetchComponent("footer-placeholder", "./components/footer.html"),
        ]).then(() => {
          // 2. Initialize AOS only after content is loaded
          if (typeof AOS !== "undefined") {
            AOS.init({
              once: true,
              offset: 100,
              duration: 800,
              easing: "ease-out-cubic",
            });
          }

          // Navbar scroll effect (after navbar is loaded)
          const navbar = document.getElementById("navbar");
          if (navbar) {
            window.addEventListener("scroll", () => {
              if (window.scrollY > 50) {
                navbar.classList.add("glass-nav");
                navbar.classList.remove("py-4");
                navbar.classList.add("py-2");
              } else {
                navbar.classList.remove("glass-nav");
                navbar.classList.remove("py-2");
                navbar.classList.add("py-4");
              }
            });
          }
        });

        // --- EXISTING PAGE SPECIFIC SCRIPTS GO HERE (e.g. Swiper, Forms) ---
        // Mobile Menu Toggle (will work after navbar is loaded via component)
        // This will be handled by the navbar component's internal scripts
      });
    </script>
  </body>
</html>
